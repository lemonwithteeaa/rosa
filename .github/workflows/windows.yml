name: Windows validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build downloadable EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Source

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: Source/go.mod
          cache: false

      - name: Build Windows GUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\artifacts | Out-Null
          go build -trimpath -ldflags "-H windowsgui" -o ..\artifacts\ROSA.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: rosa-windows-amd64
          path: artifacts/ROSA.exe

  current-tests:
    name: Run current baseline tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Source

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: Source/go.mod
          cache: false

      - name: Run Go tests
        run: go test -count=1 ./internal/authcrypto ./nno_core

  reference-audit:
    name: Audit saved CO2 references
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source

    steps:
      - uses: actions/checkout@v5

      - name: Audit saved CO2 references
        run: python reference/co2_plan/verify_reference.py

  legacy-tests:
    name: Audit legacy test suite (known failures)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Source

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: Source/go.mod
          cache: false

      - name: Run historical tests without blocking the EXE
        run: go test -count=1 ./...
